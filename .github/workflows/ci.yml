name: CI Multi-tier Testing

on:
  push:
    branches: [ "do-an-kiem-thu", "main", "master" ]
  pull_request:
    branches: [ "do-an-kiem-thu", "main", "master" ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Tier 1 - Unit Tests & JaCoCo Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 11 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run All Pure Unit Tests & JaCoCo Coverage
        run: ./mvnw -B test -Dtest="*UnitTest,ProductPriceUtilsTest,DataUtilsTest" -DfailIfNoTests=false

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-surefire-reports
          path: |
            sm-core/target/surefire-reports/
            sm-shop/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload JaCoCo Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: |
            sm-core/target/site/jacoco/
            sm-shop/target/site/jacoco/
          if-no-files-found: ignore

      - name: Publish Test & Coverage Summary to GitHub Step Summary
        if: always()
        run: |
          echo "## 📊 Unit Test & JaCoCo Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Framework**: JUnit 5 (Jupiter) + Mockito + AssertJ" >> $GITHUB_STEP_SUMMARY
          echo "- **Coverage Tool**: JaCoCo Maven Plugin 0.8.8" >> $GITHUB_STEP_SUMMARY
          echo "- **Scope**: Pure Unit Testing (Isolated In-Memory, No DB / No Spring Boot Container)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Target Services & Facades Coverage Breakdown" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Target Class | Line Coverage | Branch Coverage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY

          if [ -f "sm-core/target/site/jacoco/jacoco.csv" ]; then
            awk -F',' '$3 ~ /^(CustomerServiceImpl|PaymentServiceImpl|CategoryServiceImpl|ProductServiceImpl|ProductInventoryServiceImpl|ProductAvailabilityServiceImpl|CustomerAttributeServiceImpl|CustomerOptinServiceImpl|CustomerReviewServiceImpl|DataUtils|ProductPriceUtils)$/ {
              total_lines = $8 + $9;
              line_pct = (total_lines > 0) ? int(($9 * 100) / total_lines) : 0;
              total_branches = $6 + $7;
              branch_pct = (total_branches > 0) ? int(($7 * 100) / total_branches) : 0;
              printf "| sm-core | `%s` | %d / %d (%d%%) | %d / %d (%d%%) | ✅ PASS |\n", $3, $9, total_lines, line_pct, $7, total_branches, branch_pct;
            }' sm-core/target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f "sm-shop/target/site/jacoco/jacoco.csv" ]; then
            awk -F',' '$3 ~ /^(CustomerFacadeImpl|PaymentConfigurationFacadeImpl|ProductInventoryFacadeImpl|JWTTokenUtil|JWTCustomerAuthenticationManager|JWTAdminAuthenticationManager)$/ {
              total_lines = $8 + $9;
              line_pct = (total_lines > 0) ? int(($9 * 100) / total_lines) : 0;
              total_branches = $6 + $7;
              branch_pct = (total_branches > 0) ? int(($7 * 100) / total_branches) : 0;
              printf "| sm-shop | `%s` | %d / %d (%d%%) | %d / %d (%d%%) | ✅ PASS |\n", $3, $9, total_lines, line_pct, $7, total_branches, branch_pct;
            }' sm-shop/target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY
          fi

  build:
    name: Tier 2 - Build & Install Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 11 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build and Install Whole Repository
        run: ./mvnw -B -DskipTests install

  api:
    name: Tier 3 - API Integration Tests
    needs: [build, unit-tests]
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci_temp_password
          MYSQL_DATABASE: SALESMANAGER
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -uroot -pci_temp_password" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 11 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Synchronize MySQL Root Password with Secret
        run: |
          docker exec $(docker ps -q -f ancestor=mysql:8) mysql -u root -pci_temp_password -e "ALTER USER 'root'@'%' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}'; ALTER USER 'root'@'localhost' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}'; FLUSH PRIVILEGES;"

      - name: Generate database.properties from Secrets
        run: |
          mkdir -p sm-shop/src/main/resources
          cat <<EOF > sm-shop/src/main/resources/database.properties
          db.jdbcUrl=jdbc:mysql://127.0.0.1:3306/SALESMANAGER?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          db.user=root
          db.password=${{ secrets.DB_PASSWORD }}
          db.driverClass=com.mysql.cj.jdbc.Driver
          hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
          db.show.sql=false
          db.preferredTestQuery=SELECT 1
          db.schema=SALESMANAGER
          hibernate.hbm2ddl.auto=update
          db.initialPoolSize=4
          db.minPoolSize=4
          db.maxPoolSize=8
          EOF

      - name: Package sm-shop with database.properties
        run: ./mvnw -B -DskipTests -f sm-shop/pom.xml package

      - name: Start Shopizer Backend in Background
        run: |
          nohup java -jar sm-shop/target/shopizer.jar > backend.log 2>&1 &
          echo "Shopizer backend launched with PID: $!"

      - name: Wait for Backend to be Ready (max 5 minutes)
        run: |
          echo "Waiting for backend at http://localhost:8080/v2/api-docs..."
          for i in {1..60}; do
            if curl -s -f http://localhost:8080/v2/api-docs > /dev/null; then
              echo "Backend is ready after $((i * 5)) seconds!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Timeout waiting for backend (5 minutes)!"
              echo "=== BACKEND LOG ==="
              cat backend.log
              exit 1
            fi
            sleep 5
          done

      - name: Run API Tests
        run: |
          ./mvnw -B -f api-tests/pom.xml test \
            -Dapi.baseUrl=http://localhost:8080 \
            -Dapi.user=admin@shopizer.com \
            -Dapi.password=${{ secrets.ADMIN_PASSWORD }}

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-surefire-reports
          path: api-tests/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload Backend Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log
          if-no-files-found: ignore
